name: Firmware Release

on:
  workflow_dispatch:
    inputs:
      notes_en:
        description: 'English OTA release notes (2-8 lines, max 96 ASCII bytes each)'
        required: true
        type: string
      notes_zh:
        description: 'Chinese OTA release notes (2-8 lines, max 32 characters each)'
        required: true
        type: string
  push:
    tags:
      - '*.*.*'

concurrency:
  group: firmware-${{ github.event_name == 'push' && 'stable' || 'nightly' }}-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      matrix: ${{ steps.release.outputs.matrix }}
      build_id: ${{ steps.release.outputs.build_id }}
      build_tag: ${{ steps.release.outputs.build_tag }}
      partial: ${{ steps.release.outputs.partial }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            channel=stable
            version="$(python3 -c 'import configparser; c=configparser.ConfigParser(); c.read("platformio.ini"); print(c["crosspoint"]["version"])')"
            if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::Stable tag $GITHUB_REF_NAME does not match firmware version $version"
              exit 1
            fi
          else
            channel=nightly
          fi
          partial=false
          matrix_args=()
          if [ "$channel" = nightly ] && [ "$GITHUB_REF_NAME" != main ]; then
            partial=true
            matrix_args+=(--matrix-target waveshare_epaper_397)
          fi
          build_id="${channel}-build-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "partial=$partial" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_id" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 scripts/package_nightly_target.py --channel "$channel" --matrix "${matrix_args[@]}")" >> "$GITHUB_OUTPUT"

  notes:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build release notes
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_ZH: ${{ inputs.notes_zh }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            notes=".github/release-notes/${GITHUB_REF_NAME}.md"
            test -f "$notes"
            cp "$notes" release-body.md
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > tag-message.txt
            python3 scripts/generate_ota_notes.py --input tag-message.txt --output ota-notes.md
            test -s ota-notes.md
            printf '\n' >> release-body.md
            cat ota-notes.md >> release-body.md
          else
            printf 'Nightly build `%s` from `%s`.\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" > release-body.md
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              python3 scripts/generate_ota_notes.py \
                --en-notes="$NOTES_EN" --zh-notes="$NOTES_ZH" --output ota-notes.md
              test -s ota-notes.md
              printf '\n' >> release-body.md
              cat ota-notes.md >> release-body.md
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release-notes
          path: |
            release-body.md
            ota-notes.md
          if-no-files-found: warn
          retention-days: 1

  build:
    needs: [prepare, select_runner]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.targetId }} (${{ needs.prepare.outputs.channel }})
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19
      - name: Set seven-character build revision
        run: echo "CROSSPOINT_RC_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build unified target
        run: pio run -e "${{ matrix.environment }}"
      - name: Package and verify unified target
        run: |
          set -euo pipefail
          python3 scripts/package_nightly_target.py "${{ matrix.targetId }}" \
            --channel "${{ needs.prepare.outputs.channel }}" \
            --output "dist/${{ matrix.targetId }}"
          (cd "dist/${{ matrix.targetId }}" && sha256sum --check *-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ needs.prepare.outputs.channel }}-${{ matrix.targetId }}
          path: dist/${{ matrix.targetId }}
          if-no-files-found: error
          retention-days: 14

  publish_github:
    needs: [prepare, notes, build]
    runs-on: ubuntu-latest
    outputs:
      has_previous: ${{ steps.previous.outputs.present }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release-notes
          path: notes
      - name: Load previous global Nightly index
        id: previous
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous/global
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download nightly --repo "$GITHUB_REPOSITORY" \
              --pattern release-index.json --dir previous/global
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.channel == 'nightly' && steps.previous.outputs.present == 'true'
        with:
          name: previous-global-index
          path: previous/global/release-index.json
          if-no-files-found: error
          retention-days: 1
      - name: Carry the previous X4 Pro image unchanged for branch Nightly
        if: needs.prepare.outputs.partial == 'true'
        run: |
          test -f previous/global/release-index.json
          python3 scripts/carry_nightly_target.py \
            --previous-index previous/global/release-index.json \
            --repository "$GITHUB_REPOSITORY" --target xteink_x4_pro \
            --output artifacts/carried-x4
      - name: Build global index
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          PARTIAL: ${{ needs.prepare.outputs.partial }}
        run: |
          notes_args=()
          [ ! -f notes/ota-notes.md ] || notes_args+=(--release-notes notes/ota-notes.md)
          if [ "$PARTIAL" = true ]; then
            notes_args+=(--previous-index previous/global/release-index.json)
          fi
          python3 scripts/build_nightly_index.py \
            --channel "$CHANNEL" --manifests artifacts --region global \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BUILD_TAG}/" \
            --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-id "$BUILD_ID" \
            --expected-sha "$GITHUB_SHA" --output release-index.json "${notes_args[@]}"
      - name: Publish immutable GitHub build
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: |
          mapfile -t assets < <(find artifacts -type f -print)
          gh release create "$BUILD_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CrossMux ${CHANNEL^} ${GITHUB_SHA::7} #${GITHUB_RUN_NUMBER}" \
            --notes-file notes/release-body.md --prerelease
      - name: Publish rolling global index last
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          title="CrossMux ${CHANNEL^} (${GITHUB_SHA::7})"
          if gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes/release-body.md --prerelease
          else
            gh release create "$CHANNEL" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes/release-body.md --prerelease
          fi
          gh release upload "$CHANNEL" release-index.json --repo "$GITHUB_REPOSITORY" --clobber
          legacy_assets="$(gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          for legacy_asset in firmware.bin firmware-cn.bin; do
            if grep -Fxq "$legacy_asset" <<< "$legacy_assets"; then
              gh release delete-asset "$CHANNEL" "$legacy_asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

  verify_publish:
    needs: [prepare, publish_github]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.partial == 'true'
        with:
          name: previous-global-index
          path: previous/global
      - name: Verify published indexes and assets
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          PARTIAL: ${{ needs.prepare.outputs.partial }}
        run: |
          previous_args=()
          if [ "$PARTIAL" = true ]; then
            previous_args+=(--previous-index previous/global/release-index.json)
          fi
          python3 scripts/verify_nightly_release.py --channel "$CHANNEL" \
            --index-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL}/release-index.json?run=${GITHUB_RUN_ID}" \
            --expected-sha "$GITHUB_SHA" "${previous_args[@]}"

  publish_stable_release:
    if: needs.prepare.outputs.channel == 'stable'
    needs: [prepare, notes, build, verify_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-stable-xteink_x4_pro
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release-notes
          path: notes
      - name: Publish versioned X4 Pro release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(artifacts/crossmux-ar0c-x4pro-firmware.bin artifacts/crossmux-ar0c-x4pro-bootloader.bin \
            artifacts/crossmux-ar0c-x4pro-partitions.bin artifacts/crossmux-ar0c-x4pro-boot_app0.bin)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "crossmux-ar0c $GITHUB_REF_NAME" --notes-file notes/release-body.md --latest
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "crossmux-ar0c $GITHUB_REF_NAME" --notes-file notes/release-body.md --latest
          fi
          existing_assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          for legacy_asset in firmware.bin firmware-cn.bin bootloader.bin partitions.bin; do
            if grep -Fxq "$legacy_asset" <<< "$existing_assets"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$legacy_asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

  sync_k3s:
    if: >-
      always() && github.repository == 'ar0c/crossmux' &&
      needs.verify_publish.result == 'success' &&
      (needs.prepare.outputs.channel == 'nightly' || needs.publish_stable_release.result == 'success')
    needs: [prepare, verify_publish, publish_stable_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.partial == 'true'
        with:
          name: previous-global-index
          path: previous/global
      - name: Trigger signed K3s mirror sync
        env:
          CROSSMUX_OTA_HOOK_KEY: ${{ secrets.CROSSMUX_OTA_HOOK_KEY }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          python3 scripts/notify_ota_mirror.py \
            --channel "$CHANNEL" --build-id "$BUILD_ID" --sha "$GITHUB_SHA"
      - name: Verify public K3s release
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          PARTIAL: ${{ needs.prepare.outputs.partial }}
        run: |
          previous_args=()
          if [ "$PARTIAL" = true ]; then
            previous_args+=(--previous-index previous/global/release-index.json)
          fi
          python3 scripts/verify_nightly_release.py --channel "$CHANNEL" \
            --index-url "https://ooo.ar0c.com/releases/download/${CHANNEL}/release-index.json" \
            --expected-sha "$GITHUB_SHA" "${previous_args[@]}"

  cleanup_github:
    if: needs.prepare.outputs.channel == 'nightly' && needs.publish_github.outputs.has_previous == 'true'
    needs: [prepare, verify_publish, publish_github]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: previous-global-index
          path: previous/global
      - name: Delete obsolete GitHub Nightly builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            > github-releases.txt
          python3 scripts/nightly_retention.py --storage github --current "$BUILD_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --previous-index previous/global/release-index.json --candidates github-releases.txt \
            > obsolete-github-builds.txt
          while IFS= read -r build_tag; do
            gh release delete "$build_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < obsolete-github-builds.txt
