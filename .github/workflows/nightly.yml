name: Firmware Release

on:
  workflow_dispatch:
    inputs:
      notes_en:
        description: 'English OTA release notes (2-8 lines, max 96 ASCII bytes each)'
        required: true
        type: string
      notes_zh:
        description: 'Chinese OTA release notes (2-8 lines, max 32 characters each)'
        required: true
        type: string
      release_target:
        description: 'Waveshare 3.97 Nightly target'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - waveshare_epaper_397

concurrency:
  group: firmware-nightly-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select_runner:
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      matrix: ${{ steps.release.outputs.matrix }}
      build_id: ${{ steps.release.outputs.build_id }}
      build_tag: ${{ steps.release.outputs.build_tag }}
      target_args: ${{ steps.release.outputs.target_args }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          set -euo pipefail
          channel=nightly
          build_id="${channel}-build-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_id" >> "$GITHUB_OUTPUT"
          target_args=(--only-target waveshare_epaper_397)
          case "${RELEASE_TARGET:-auto}" in
            auto|waveshare_epaper_397) ;;
            *) echo "::error::Unsupported Nightly target: $RELEASE_TARGET"; exit 1 ;;
          esac
          echo "target_args=${target_args[*]}" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 scripts/package_nightly_target.py --channel "$channel" --matrix "${target_args[@]}")" >> "$GITHUB_OUTPUT"

  notes:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build release notes
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_ZH: ${{ inputs.notes_zh }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then
            notes=".github/release-notes/${GITHUB_REF_NAME}.md"
            test -f "$notes"
            cp "$notes" release-body.md
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > tag-message.txt
            python3 scripts/generate_ota_notes.py --input tag-message.txt --output ota-notes.md
            test -s ota-notes.md
            printf '\n' >> release-body.md
            cat ota-notes.md >> release-body.md
          else
            printf 'Nightly build `%s` from `%s`.\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" > release-body.md
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              python3 scripts/generate_ota_notes.py \
                --en-notes="$NOTES_EN" --zh-notes="$NOTES_ZH" --output ota-notes.md
              test -s ota-notes.md
              printf '\n' >> release-body.md
              cat ota-notes.md >> release-body.md
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release-notes
          path: |
            release-body.md
            ota-notes.md
          if-no-files-found: warn
          retention-days: 1

  build:
    needs: [prepare, select_runner]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.targetId }} (${{ needs.prepare.outputs.channel }})
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB-${{ matrix.targetId }}" >> "$GITHUB_ENV"
      - name: Use runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false
      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform
      - name: Set seven-character build revision
        run: |
          echo "CROSSPOINT_RC_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "CROSSPOINT_BUILD_KIND=rc" >> "$GITHUB_ENV"
      - name: Build unified target
        run: pio run -e "${{ matrix.environment }}"
      - name: Package and verify unified target
        run: |
          set -euo pipefail
          python3 scripts/package_nightly_target.py "${{ matrix.targetId }}" \
            --channel "${{ needs.prepare.outputs.channel }}" \
            --output "dist/${{ matrix.targetId }}"
          (cd "dist/${{ matrix.targetId }}" && sha256sum --check *-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ needs.prepare.outputs.channel }}-${{ matrix.targetId }}
          path: dist/${{ matrix.targetId }}
          if-no-files-found: error
          retention-days: 14

  publish_github:
    needs: [prepare, notes, build]
    runs-on: ubuntu-latest
    outputs:
      has_previous: ${{ steps.previous.outputs.present }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release-notes
          path: notes
      - name: Load previous global Nightly index
        id: previous
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous/global
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download nightly --repo "$GITHUB_REPOSITORY" \
              --pattern release-index.json --dir previous/global
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.channel == 'nightly' && steps.previous.outputs.present == 'true'
        with:
          name: previous-global-index
          path: previous/global/release-index.json
          if-no-files-found: error
          retention-days: 1
      - name: Build global index
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: |
          scope_args=(${{ needs.prepare.outputs.target_args }})
          notes_args=()
          [ ! -f notes/ota-notes.md ] || notes_args+=(--release-notes notes/ota-notes.md)
          python3 scripts/build_nightly_index.py \
            --channel "$CHANNEL" --manifests artifacts --region global \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BUILD_TAG}/" \
            --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-id "$BUILD_ID" \
            --output release-index.json "${notes_args[@]}" "${scope_args[@]}"
      - name: Publish immutable GitHub build
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: |
          mapfile -t assets < <(find artifacts -type f -print)
          gh release create "$BUILD_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CrossMux ${CHANNEL^} ${GITHUB_SHA::7} #${GITHUB_RUN_NUMBER}" \
            --notes-file notes/release-body.md --prerelease
      - name: Publish rolling global index last
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          title="CrossMux ${CHANNEL^} (${GITHUB_SHA::7})"
          if gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes/release-body.md --prerelease
          else
            gh release create "$CHANNEL" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes/release-body.md --prerelease
          fi
          gh release upload "$CHANNEL" release-index.json --repo "$GITHUB_REPOSITORY" --clobber

  verify_publish:
    needs: [prepare, publish_github]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify published indexes and assets
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          python3 scripts/verify_nightly_release.py --channel "$CHANNEL" \
            --index-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL}/release-index.json?run=${GITHUB_RUN_ID}" \
            --expected-sha "$GITHUB_SHA" ${{ needs.prepare.outputs.target_args }}

  sync_k3s:
    if: >-
      always() && github.repository == 'ar0c/crossmux' &&
      needs.verify_publish.result == 'success'
    needs: [prepare, verify_publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trigger signed K3s mirror sync
        env:
          CROSSMUX_OTA_HOOK_KEY: ${{ secrets.CROSSMUX_OTA_HOOK_KEY }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          python3 scripts/notify_ota_mirror.py \
            --channel "$CHANNEL" --build-id "$BUILD_ID" --sha "$GITHUB_SHA"
      - name: Verify public K3s release
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          python3 scripts/verify_nightly_release.py --channel "$CHANNEL" \
            --index-url "https://ooo.ar0c.com/releases/download/${CHANNEL}/release-index.json" \
            --expected-sha "$GITHUB_SHA" ${{ needs.prepare.outputs.target_args }}
