name: CI (build)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: 10

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      format: ${{ steps.plan.outputs.format }}
      analysis: ${{ steps.plan.outputs.analysis }}
      tests: ${{ steps.plan.outputs.tests }}
      firmware: ${{ steps.plan.outputs.firmware }}
      simulator: ${{ steps.plan.outputs.simulator }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        name: Select checks from changed paths
        run: python3 scripts/ci_plan.py plan

  select_runner:
    needs: [changes, clang-format, cppcheck, unit-tests]
    if: needs.changes.outputs.firmware == 'true'
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  clang-format:
    needs: changes
    if: needs.changes.outputs.format == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix --check

  cppcheck:
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Install cppcheck runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build-default:
    name: Build Waveshare 3.97
    needs: [changes, select_runner, clang-format, cppcheck, unit-tests]
    if: needs.changes.outputs.firmware == 'true'
    timeout-minutes: 45
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Use runner temporary directory
        # Avoid the self-hosted runner's shared /tmp tmpfs.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build Waveshare 3.97 firmware
        run: |
          set -euo pipefail
          export CROSSPOINT_RC_HASH="${GITHUB_SHA::7}"
          pio run -e waveshare_epaper_397_nightly | tee pio.log

      - name: Verify Waveshare hardware package
        run: |
          set -euo pipefail
          python3 scripts/package_nightly_target.py waveshare_epaper_397 --channel nightly
          (cd dist/nightly/waveshare_epaper_397 && sha256sum --check *-SHA256SUMS)

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## Waveshare 3.97 firmware build stats"
            echo '```text'
            grep -E '^Processing |RAM:\s|Flash:\s' pio.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Waveshare 3.97 firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: crossmux-ar0c-waveshare-epaper-397-firmware.bin
          path: .pio/build/waveshare_epaper_397_nightly/firmware.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: waveshare-build-log
          path: pio.log
          if-no-files-found: ignore

  build-simulator:
    name: Build simulator
    needs: [changes, clang-format, cppcheck, unit-tests]
    if: needs.changes.outputs.simulator == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Use runner temporary directory
        # Avoid the self-hosted runner's shared /tmp tmpfs.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Install simulator build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Compile simulator
        run: |
          set -euo pipefail
          pio run -e simulator | tee pio.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simulator-build-log
          path: pio.log
          if-no-files-found: ignore

  unit-tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

      - name: Run FreeInk SDK host tests
        run: |
          bash freeink-sdk/libs/book/FreeInkBook/test/host/run.sh
          bash freeink-sdk/libs/ui/FreeInkUI/test/host/run.sh
          python3 freeink-sdk/libs/display/EpdiyLcd/test/host/test_transactions.py

      - name: Run hardware packaging tests
        run: python3 -m unittest discover -v -s scripts/tests

  # Keep this required check running even when documentation skips builds.
  test-status:
    name: Test Status
    needs: [changes, clang-format, cppcheck, unit-tests, select_runner, build-default, build-simulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Summarize and verify selected checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py result
