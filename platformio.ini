[platformio]
default_envs = x4pro
; Keep pinned frameworks/platform patches separate from other projects.
core_dir = .platformio
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.6.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC and RSA (sp_c32.c). Fast-math otherwise
# heap-allocates many FP_MAX_BITS temporaries during key exchange and RSA
# CertificateVerify. SP uses fixed-width workspaces; with WOLFSSL_SMALL_STACK,
# RSA-2048/4096 public operations need one temporary block of about 1.4/2.8KB.
# SP_SMALL trades large precomputed tables for flash, and SP_4096 covers the
# largest RSA public key accepted by the existing FP_MAX_BITS=8192 setting.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_HAVE_SP_RSA
  -DWOLFSSL_SP_SMALL
  -DWOLFSSL_SP_4096
# SecureClient is the sole TLS fragment policy owner and requests 2KB records.
# This is a request, not a guarantee: peers may ignore the extension.
  -DHAVE_MAX_FRAGMENT
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
  ; Single firmware: CJK parsing/rendering and regional apps are always built.
  -DENABLE_CHINESE_VERSION=1

build_unflags =
  -std=gnu++11
  -fexceptions

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_pioarduino_cache.py
  pre:scripts/patch_windows_middleware.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  knolleary/PubSubClient @ ^2.8
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  !python3 -c "import platform; print('-lcrypto' if platform.system() == 'Linux' else '')"
  -Wno-narrowing
  -DSIMULATOR
  -DFREEINK_DEVICE_X4CLASSIC=0
  -DCROSSPOINT_EMULATED=1
  -DCROSSPOINT_SIMULATOR_OTA_CHANNELS=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_CHINESE_VERSION=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
  -Ilib/hal
build_unflags =
  -std=gnu++11
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets
extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
lib_deps =
  simulator=https://github.com/0x1abin/crosspoint-simulator.git#dacbbbcdc133a052f9122347429fdcb8cddf80af
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  knolleary/PubSubClient @ 2.8

; Common host dependencies; target-specific controller/allocator flags stay below.

[ble_host]
build_flags =
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DFREEINK_BLE_HID_SHOW_UNNAMED_DEVICES=0
lib_deps =
  ${base.lib_deps}
  h2zero/NimBLE-Arduino @ 2.3.8
extra_scripts =
  ${base.extra_scripts}
  pre:scripts/patch_ble_keyboard_host.py

; C3 host/controller settings shared by development, release, RC and slim.

[s3_ble]
build_flags =
  ${ble_host.build_flags}
  -Wl,--wrap=xTaskCreatePinnedToCore
lib_deps = ${ble_host.lib_deps}
extra_scripts = ${ble_host.extra_scripts}

[s3_ble_psram]
lib_deps = ${s3_ble.lib_deps}
extra_scripts =
  ${s3_ble.extra_scripts}
  pre:scripts/configure_nimble_psram.py
build_flags =
  ${s3_ble.build_flags}
  -DCROSSPOINT_BLE_HOST_PSRAM=1

[s3_nightly]
build_flags =
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

; --- Xteink X4 Pro -----------------------------------------------------------

[x4pro_hardware]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
; Use the prebuilt dio_opi Arduino variant: its TinyUSB component is enabled
; for CDC and MSC.
lib_deps = ${s3_ble_psram.lib_deps}
extra_scripts = ${s3_ble_psram.extra_scripts}
build_flags =
  ${base.build_flags}
  ${s3_ble_psram.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossMux-X4Pro\"
  -DUSB_MANUFACTURER=\"CrossMux\"
  ; X4 Pro SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:x4pro]
extends = x4pro_hardware
build_flags =
  ${x4pro_hardware.build_flags}
  ; CROSSPOINT_VERSION and ar0c artifact name come from scripts/git_branch.py.
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

[env:x4pro-gh_release]
extends = x4pro_hardware
build_flags =
  ${x4pro_hardware.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

[env:x4pro-gh_release_rc]
extends = x4pro_hardware
build_flags =
  ${x4pro_hardware.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

[env:x4pro_nightly]
extends = x4pro_hardware
build_flags =
  ${x4pro_hardware.build_flags}
  ${s3_nightly.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro-rc+${sysenv.CROSSPOINT_RC_HASH}\"

; Physical-button sound feedback shared by supported hardware.

[sound_feedback_hardware]
extends = base
board_build.embed_files =
  assets/sounds/select.wav
  assets/sounds/tap.wav
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_CAP_SOUND_FEEDBACK=1
lib_deps =
  ${base.lib_deps}
  AudioManager=symlink://freeink-sdk/libs/hardware/AudioManager

; --- Waveshare ESP32-S3 ePaper 3.97 — SSD1677 + AXP2101 --------------------
; Experimental target. The reading core uses 4-bit SDMMC, PCF85063A RTC, and
; the four physical buttons. ES8311/NS4150B audio is limited to immediate physical
; button feedback with Off/Low/Medium/High levels; IMU and environmental sensors stay out.

[waveshare_epaper_397_hardware]
extends = sound_feedback_hardware
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; Keep this profile on the prebuilt TinyUSB-enabled variant so USB Drive can
; switch the shared S3 PHY from Serial/JTAG to MSC and back.
board_build.arduino.memory_type = dio_opi
lib_deps =
  ${s3_ble_psram.lib_deps}
  AudioManager=symlink://freeink-sdk/libs/hardware/AudioManager
extra_scripts = ${s3_ble_psram.extra_scripts}
build_flags =
  ${sound_feedback_hardware.build_flags}
  ${s3_ble_psram.build_flags}
  -DFREEINK_DEVICE_WAVESHARE_EPAPER_397=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossMux-Waveshare-ePaper397\"
  -DUSB_MANUFACTURER=\"CrossMux\"
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:waveshare_epaper_397]
extends = waveshare_epaper_397_hardware
build_flags =
  ${waveshare_epaper_397_hardware.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

[env:waveshare_epaper_397_nightly]
extends = waveshare_epaper_397_hardware
build_flags =
  ${waveshare_epaper_397_hardware.build_flags}
  ${s3_nightly.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-waveshare-epaper-397-rc+${sysenv.CROSSPOINT_RC_HASH}\"

; --- Metalio E-Ink 4 — SSD1677 + CST816S + TCA9555 ----------------------
