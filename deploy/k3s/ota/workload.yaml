apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossmux-ota
  labels:
    app.kubernetes.io/name: crossmux-ota
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crossmux-ota
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crossmux-ota
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: mst01
      containers:
        - name: files
          image: python@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          command: [python, /app/serve_ota_release.py, --root, /data, --port, '8080']
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /data, readOnly: true}
      volumes:
        - name: code
          configMap: {name: crossmux-ota-code}
        - name: data
          hostPath: {path: /home/ar0c/crossmux-ota-dist, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: crossmux-ota
spec:
  selector:
    app.kubernetes.io/name: crossmux-ota
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossmux-ota-hook
  labels:
    app.kubernetes.io/name: crossmux-ota-hook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crossmux-ota-hook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crossmux-ota-hook
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: mst01
      containers:
        - name: hook
          image: python@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          command: [python, /app/hook_ota_release.py, --root, /data, --key-file, /run/hook/key, --port, '8081']
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
          ports:
            - {name: http, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: key, mountPath: /run/hook, readOnly: true}
      volumes:
        - name: code
          configMap: {name: crossmux-ota-code}
        - name: data
          hostPath: {path: /home/ar0c/crossmux-ota-dist, type: DirectoryOrCreate}
        - name: key
          secret: {secretName: crossmux-ota-hook-key}
---
apiVersion: v1
kind: Service
metadata:
  name: crossmux-ota-hook
spec:
  selector:
    app.kubernetes.io/name: crossmux-ota-hook
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crossmux-ota-mirror-nightly
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: mst01
          containers:
            - name: mirror
              image: python@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
              command: [python, /app/mirror_ota_release.py, --root, /data, --channel, nightly]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {cpu: 500m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: code, mountPath: /app, readOnly: true}
                - {name: data, mountPath: /data}
          volumes:
            - name: code
              configMap: {name: crossmux-ota-code}
            - name: data
              hostPath: {path: /home/ar0c/crossmux-ota-dist, type: DirectoryOrCreate}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crossmux-ota-mirror-stable
spec:
  schedule: '10 */2 * * *'
  suspend: true # Enable after the fork publishes its first Stable release.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: mst01
          containers:
            - name: mirror
              image: python@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
              command: [python, /app/mirror_ota_release.py, --root, /data, --channel, stable]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {cpu: 500m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: code, mountPath: /app, readOnly: true}
                - {name: data, mountPath: /data}
          volumes:
            - name: code
              configMap: {name: crossmux-ota-code}
            - name: data
              hostPath: {path: /home/ar0c/crossmux-ota-dist, type: DirectoryOrCreate}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crossmux-ota
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.tls.options: kube-system-cloudflare-aop-required@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ooo.ar0c.com
      http:
        paths:
          - path: /hooks/release
            pathType: Exact
            backend:
              service:
                name: crossmux-ota-hook
                port: {number: 8081}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crossmux-ota
                port: {number: 8080}
  tls:
    - hosts: [ooo.ar0c.com]
      secretName: ar0c-tls
